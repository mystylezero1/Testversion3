<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochzeit Anja & Dino</title>
    <style>
        /* Hier liegt jetzt das gesamte CSS, damit es garantiert geladen wird */
        :root { --gold: #D4AF37; --gold-light: #F4E8C1; --gold-dark: #A38018; --creme: #FAF7F2; --white: #FFFFFF; --dark: #2A2A2A; --shadow: 0 4px 15px rgba(0,0,0,0.06); --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--creme); color: var(--dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 0.5rem; }
        .header { text-align: center; margin: 1rem; width: 100%; max-width: 900px; }
        .header h1 { font-family: Georgia, serif; color: var(--gold-dark); font-size: 1.7rem; }
        .card { background: var(--white); padding: 1rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--gold-light); width: 100%; max-width: 950px; margin-bottom: 1rem; }
        .hidden { display: none !important; }
        .map-viewport { width: 100%; height: 500px; overflow: auto; position: relative; border-radius: var(--radius); background: var(--white); border: 1px solid var(--gold-light); }
        .map-container { position: relative; width: 900px; height: 950px; margin: 0 auto; transition: transform 0.6s ease; }
        .table-marker { position: absolute; transform: translate(-50%, -50%); background: var(--white); border: 1px solid var(--gold-light); border-radius: 8px; width: 130px; min-height: 75px; display: flex; flex-direction: column; padding: 5px; box-shadow: 0 3px 10px rgba(0,0,0,0.04); }
        .table-header { border-bottom: 1px solid var(--gold-light); font-size: 0.7rem; font-weight: bold; color: var(--gold-dark); margin-bottom: 3px; }
        .guest-row { display: grid; grid-template-columns: 24px 1fr; font-size: 0.6rem; color: #444; }
        .guest-seat { background: var(--gold-light); color: var(--gold-dark); text-align: center; font-weight: bold; margin-right: 3px; }
        .btn-creme { background: var(--gold-light); border: none; padding: 0.6rem; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <h1>Anja & Dino</h1>
        <p>Finde deinen Platz im Saal</p>
    </header>

    <main id="main" style="width: 100%; max-width: 950px;">
        <section class="card">
            <h2>Gast finden</h2>
            <input type="text" id="search-input" placeholder="Name eingeben..." style="width:100%; padding:0.5rem; margin-top:0.5rem;">
        </section>

        <section class="card map-card">
            <div class="map-viewport">
                <div id="map-container" class="map-container">
                    <div id="tables-layer"></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        // Wir laden die Daten direkt, wenn die Seite lädt
        async function init() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();
                const layer = document.getElementById('tables-layer');
                data.tables.forEach(table => {
                    const marker = document.createElement('div');
                    marker.className = 'table-marker';
                    marker.style.left = table.x + '%';
                    marker.style.top = table.y + '%';
                    const guests = data.guests.filter(g => g.tableId === table.id);
                    marker.innerHTML = `<div class="table-header">${table.name}</div>` + 
                        guests.map(g => `<div class="guest-row"><span class="guest-seat">${g.seat}</span><span>${g.name}</span></div>`).join('');
                    layer.appendChild(marker);
                });
            } catch(e) { console.error("Daten konnten nicht geladen werden", e); }
        }
        init();
    </script>
</body>
</html>
