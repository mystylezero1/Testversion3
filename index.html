<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochzeit Anja & Dino</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <header class="header">
        <h1 id="app-title">Anja & Dino</h1>
        <p id="app-subtitle">Finde deinen Sitzplatz</p>
        <button id="admin-trigger-btn" class="btn-admin-trigger" title="Admin Konsole">🔒 Admin</button>
    </header>

    <main class="main-container">
        <!-- Willkommensseite / Suche -->
        <section id="search-section" class="card">
            <h2>Gast finden</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Name eingeben (z.B. Max)..." autocomplete="off">
                <div id="search-results" class="results-dropdown"></div>
            </div>
            <div class="welcome-actions" style="margin-top: 1rem;">
                <button id="pdf-download-btn" class="btn-creme">📥 Saalplan als PDF drucken / speichern</button>
            </div>
        </section>

        <!-- Saalplan Ansicht -->
        <section id="map-section" class="card map-card hidden">
            <div class="map-header">
                <h3 id="target-guest-info">Saalplan</h3>
                <button id="reset-map-btn" class="btn-secondary">🗺️ Gesamtkarte</button>
            </div>
            <div id="map-viewport" class="map-viewport">
                <div id="map-container" class="map-container">
                    <div class="room-zone" style="bottom: 10px; left: 10px; width: 100px; height: 40px;">🚪 Eingang</div>
                    <div class="room-zone" style="bottom: 10px; left: 120px; right: 10px; height: 40px;">🎧 DJ & Tanzfläche</div>
                    <div class="room-zone buffet-zone" style="top: 35%; right: 10px;">🥂 Ausschank & Buffet</div>
                    
                    <div id="tables-layer" class="tables-layer"></div>
                </div>
            </div>
            <div id="speech-banner" class="speech-banner hidden">
                <span id="speech-text"></span>
            </div>
        </section>
    </main>

    <!-- Dialog bei doppelten Namen -->
    <dialog id="disambiguation-dialog" class="modal">
        <h3>Mehrere Personen gefunden</h3>
        <p>Bitte wähle deinen genauen Platz aus:</p>
        <div id="disambiguation-list" class="modal-list"></div>
        <div class="modal-actions">
            <button type="button" id="disambiguation-close-btn" class="btn-secondary">Abbrechen</button>
        </div>
    </dialog>

    <!-- Admin Modal -->
    <dialog id="admin-dialog" class="modal">
        <h3>🔒 Admin-Konsole</h3>
        <div id="admin-auth">
            <input type="password" id="admin-password" placeholder="Passwort" style="width:100%; padding:0.6rem; margin-bottom:1rem; border:1px solid #ccc; border-radius:6px;">
            <button id="admin-login-btn" class="btn-gold">Einloggen</button>
        </div>
        <div id="admin-panel" class="hidden">
            <div class="admin-tools" style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                <button id="excel-export-btn" class="btn-creme" style="font-size:0.8rem;">Export</button>
                <button id="excel-import-btn" class="btn-creme" style="font-size:0.8rem;">Import</button>
                <input type="file" id="excel-import-file" accept=".xlsx, .xls" class="hidden">
            </div>
            <div style="margin-bottom: 1rem; border-top: 1px solid #eee; padding-top: 0.5rem;">
                <h4>Gast hinzufügen</h4>
                <input type="text" id="new-guest-name" placeholder="Name" style="width:100%; padding:0.4rem; margin-bottom:0.3rem;">
                <input type="number" id="new-guest-seat" placeholder="Sitzplatz-Nr" style="width:100%; padding:0.4rem; margin-bottom:0.3rem;">
                <select id="new-guest-table" style="width:100%; padding:0.4rem; margin-bottom:0.5rem;"></select>
                <button id="add-guest-btn" class="btn-gold" style="font-size:0.8rem;">Speichern</button>
            </div>
            <div id="admin-guest-list" class="admin-list" style="max-height:150px; overflow-y:auto; font-size:0.85rem;"></div>
            <button id="admin-close-btn" class="btn-secondary" style="margin-top:1rem;">Schließen</button>
        </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>
</html>
