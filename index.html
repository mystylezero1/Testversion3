<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochzeit Anja & Dino - Sitzplan</title>
    <link rel="stylesheet" href="style.css">
    <!-- Externe Bibliothek für das Gold-Konfetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Canvas für Konfetti Animation -->
    <canvas id="confetti-canvas"></canvas>

    <!-- App-Inhalt (für Gäste und Admin) -->
    <div id="app-content">
        <header class="header">
            <h1 id="app-title">Anja & Dino</h1>
            <p id="app-subtitle">Finde deinen Sitzplatz</p>
            <!-- Admin Button: Nur am Desktop sichtbar -->
            <button id="admin-trigger-btn" class="btn-icon desktop-only">⚙️ Admin</button>
        </header>

        <main class="main-container">
            <!-- Startseite: Suchfunktion -->
            <section id="search-section" class="card">
                <h2>Gast finden</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Name eingeben (z.B. Max)..." autocomplete="off">
                    <div id="search-results" class="results-dropdown"></div>
                </div>
            </section>

            <!-- Saalplan (Wird erst nach der Suche sichtbar) -->
            <section id="map-section" class="card map-card hidden">
                <div class="map-header">
                    <h3 id="target-guest-info">Saalplan</h3>
                </div>
                <div id="map-viewport" class="map-viewport">
                    <div id="map-container" class="map-container">
                        <!-- Hier wird später dein Grundriss geladen -->
                        <img src="assets/saalplan.jpg" id="map-image" alt="Saalplan" />
                        <div id="tables-layer" class="tables-layer"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Wir laden hier später die Logik -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
