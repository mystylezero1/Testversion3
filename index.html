<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💍 Hochzeitsgesellschaft Anja & Dino</title>

    <meta name="theme-color" content="#b76e79">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="app-header">

        <h1>
            💍 Hochzeitsgesellschaft<br>
            <span>Anja & Dino</span>
        </h1>

        <p>
            Finde schnell deinen Sitzplatz
        </p>

    </header>


    <!-- SUCHE -->
    <section class="search-area">

        <input 
            id="searchInput"
            type="search"
            placeholder="Name, Tisch oder Sitzplatz suchen..."
            autocomplete="off"
        >

        <button id="clearSearch">
            ✕
        </button>

    </section>



    <!-- STATUS -->
    <section class="search-result" id="searchResult">

        <div class="result-box">

            <strong>
                Suche starten
            </strong>

            <span>
                Gib einen Namen oder eine Tisch-/Platznummer ein.
            </span>

        </div>

    </section>



    <!-- GRUNDRISS -->
    <main class="map-container">


        <div class="zoom-wrapper" id="zoomWrapper">


            <svg 
                id="weddingMap"
                viewBox="0 0 1200 900"
                xmlns="http://www.w3.org/2000/svg"
            >


                <!-- RAUM -->
                <rect
                    id="room"
                    x="20"
                    y="20"
                    width="1160"
                    height="860"
                    rx="30"
                />



                <!-- EINGANG -->
                <g id="entrance">

                    <rect
                        x="40"
                        y="400"
                        width="120"
                        height="80"
                        rx="15"
                    />

                    <text
                        x="100"
                        y="445"
                        text-anchor="middle"
                    >
                        🚪 Eingang
                    </text>

                </g>



                <!-- DJ -->
                <g id="dj">

                    <rect
                        x="950"
                        y="60"
                        width="150"
                        height="80"
                        rx="15"
                    />

                    <text
                        x="1025"
                        y="105"
                        text-anchor="middle"
                    >
                        🎧 DJ
                    </text>

                </g>



                <!-- TANZFLÄCHE -->
                <g id="dancefloor">

                    <ellipse
                        cx="600"
                        cy="430"
                        rx="170"
                        ry="110"
                    />

                    <text
                        x="600"
                        y="435"
                        text-anchor="middle"
                    >
                        💃 Tanzfläche
                    </text>

                </g>



                <!-- BUFFET -->
                <g id="buffet">

                    <rect
                        x="200"
                        y="720"
                        width="260"
                        height="70"
                        rx="20"
                    />

                    <text
                        x="330"
                        y="765"
                        text-anchor="middle"
                    >
                        🍽 Buffet
                    </text>

                </g>

                <!-- TISCHE -->
                <g id="tables">

                    <!-- BRAUTTISCH -->
                    <g 
                        id="table-Braut"
                        class="table wedding-table"
                        data-table="Braut"
                    >

                        <ellipse
                            cx="600"
                            cy="170"
                            rx="180"
                            ry="70"
                        />

                        <text
                            x="600"
                            y="175"
                            text-anchor="middle"
                            class="table-title"
                        >
                            💍 Braut-Tisch
                        </text>


                        <!-- Sitzplätze werden automatisch erzeugt -->

                    </g>



                    <!-- NORMALE TISCHE -->
                    <g 
                        id="table-container"
                    >

                        <!--
                            Die Tische werden später automatisch
                            aus data.json geladen.

                            Beispiel:

                            Tisch 3
                            Tisch 4
                            Tisch 5
                            usw.
                        -->

                    </g>


                </g>



                <!-- INFO BEREICH -->

                <g id="infoBubble" class="hidden">

                    <rect
                        x="0"
                        y="0"
                        width="250"
                        height="120"
                        rx="20"
                    />

                    <text
                        id="bubbleText"
                        x="125"
                        y="60"
                        text-anchor="middle"
                    >
                    </text>

                </g>


            </svg>


        </div>


    </main>



    <!-- FOOTER -->

    <footer class="app-footer">

        <div>
            ❤️ Anja & Dino
        </div>

        <div>
            Wedding App 2.0
        </div>

    </footer>


</div>



<!-- MODULE -->

<script src="config.js"></script>

<script src="app.js"></script>

<script src="search.js"></script>

<script src="animation.js"></script>

<script src="speech.js"></script>

<script src="admin.js"></script>

<script src="excel.js"></script>


</body>
</html>
