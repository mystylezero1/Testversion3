<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding App 2.0</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Canvas für Konfetti -->
  <canvas id="confetti-canvas"></canvas>

  <header class="header">
    <h1 id="app-title">Anja & Dino</h1>
    <p id="app-subtitle">Hochzeits-Sitzplan</p>
    <button id="admin-trigger-btn" class="btn-icon">🔒</button>
  </header>

  <!-- Mobil-Schutz / Suche (Startseite) -->
  <main class="main-container">
    <section id="search-section" class="card">
      <h2>Gast finden</h2>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Name eingeben (z.B. Max)..." autocomplete="off">
        <div id="search-results" class="results-dropdown"></div>
      </div>
    </section>

    <!-- Saalplan (Erst nach Gastsuche oder im Entdeckermodus aktiv) -->
    <section id="map-section" class="card map-card hidden">
      <div class="map-header">
        <h3 id="target-guest-info">Saalplan</h3>
        <button id="speech-btn" class="btn-secondary">🔊 Spruch</button>
      </div>

      <div id="map-viewport" class="map-viewport">
        <div id="map-container" class="map-container">
          <img src="assets/saalplan.png" id="map-image" alt="Saalplan" />
          <div id="tables-layer" class="tables-layer"></div>
        </div>
      </div>

      <!-- Fotobox & Gästebuch Footer Banner -->
      <div class="action-footer">
        <a id="photo-link" href="#" target="_blank" class="btn-gold">📷 Fotos teilen</a>
        <button id="guestbook-open-btn" class="btn-creme">📝 Gästebuch</button>
      </div>
    </section>
  </main>

  <!-- Dialog für doppelte Namen -->
  <dialog id="disambiguation-dialog" class="modal">
    <h3>Mehrere Personen gefunden</h3>
    <p>Bitte wähle deinen Namen aus:</p>
    <div id="disambiguation-list" class="modal-list"></div>
  </dialog>

  <!-- Gästebuch Modal -->
  <dialog id="guestbook-dialog" class="modal">
    <h3>❤️ Nachricht für Anja & Dino</h3>
    <form id="guestbook-form">
      <input type="text" id="gb-author" placeholder="Dein Name" required>
      <textarea id="gb-message" placeholder="Deine Wünsche für das Brautpaar..." required></textarea>
      <div class="modal-actions">
        <button type="button" id="gb-close-btn" class="btn-secondary">Abbrechen</button>
        <button type="submit" class="btn-gold">Senden</button>
      </div>
    </form>
  </dialog>

  <!-- Admin Modal -->
  <dialog id="admin-dialog" class="modal">
    <h3>🔒 Admin Bereich</h3>
    <div id="admin-auth">
      <input type="password" id="admin-password" placeholder="Passwort">
      <button id="admin-login-btn" class="btn-gold">Login</button>
    </div>
    <div id="admin-panel" class="hidden">
      <div class="admin-tools">
        <button id="excel-export-btn" class="btn-creme">Excel Export</button>
        <input type="file" id="excel-import-file" accept=".xlsx, .xls" class="hidden">
        <button id="excel-import-btn" class="btn-creme">Excel Import</button>
      </div>
      <div id="admin-guest-list" class="admin-list"></div>
      <button id="admin-close-btn" class="btn-secondary">Schließen</button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
