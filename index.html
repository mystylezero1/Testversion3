<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochzeit Anja & Dino - Sitzplan</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div id="expiry-screen" class="expiry-message hidden">
        <h1>Vielen Dank!</h1>
        <p>Es war eine unvergessliche Feier.</p>
    </div>

    <div id="app-content">
        <header class="header">
            <h1 id="app-title">Anja & Dino</h1>
            <p id="app-subtitle">Finde deinen Sitzplatz</p>
            <button id="admin-trigger-btn" class="btn-icon desktop-only">⚙️ Admin</button>
        </header>

        <main class="main-container">
            <section id="search-section" class="card">
                <h2>Gast finden</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Name eingeben (z.B. Max)..." autocomplete="off">
                    <div id="search-results" class="results-dropdown"></div>
                </div>
            </section>

            <section id="map-section" class="card map-card hidden">
                <div class="map-header">
                    <h3 id="target-guest-info">Saalplan</h3>
                </div>
                <!-- Der stabile Image-Viewport -->
                <div id="map-viewport" class="map-viewport">
                    <div id="map-container" class="map-container">
                        <img src="assets/saalplan.jpg" id="map-image" alt="Saalplan" />
                        <div id="tables-layer" class="tables-layer"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <dialog id="disambiguation-dialog" class="modal">
        <h3>Mehrere Personen gefunden</h3>
        <p>Bitte wähle deinen genauen Platz aus:</p>
        <div id="disambiguation-list" class="modal-list"></div>
        <div class="modal-actions">
            <button type="button" id="disambiguation-close-btn" class="btn-secondary">Abbrechen</button>
        </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>
</html>
